; W6 stand firmware. Three environments:
;   c3       build, and flash over USB:            pio run -e c3 -t upload
;   ota      build, and send over Wi-Fi:           pio run -e ota -t upload   (needs W6_HOST and W6_TOKEN, see README)
;   preview  render the screens on this computer:  pio run -e preview && .pio/build/preview/program
[platformio]
default_envs = c3

[env:c3]
platform = espressif32@6.9.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
; Two 1.9 MB app slots for over-the-air updates. Changing the partition table needs one USB flash.
board_build.partitions = min_spiffs.csv
build_src_filter = +<*> -<preview/>
extra_scripts = pre:tools/fast_paint.py
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
lib_deps =
    moononournation/GFX Library for Arduino@1.4.9
    lvgl/lvgl@8.3.11
    bblanchon/ArduinoJson@7.2.1

[env:ota]
extends = env:c3
upload_protocol = custom
upload_command = python3 tools/w6.py ota $SOURCE

[env:preview]
platform = native
build_src_filter = +<ui.cpp> +<charging_fx.cpp> +<living_fx.cpp> +<wood.cpp> +<fonts/> +<preview/>
build_flags =
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
lib_deps =
    lvgl/lvgl@8.3.11
